<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Sparse Feature Interpretability Lab dashboard preview</title><desc id="desc">Static synthetic dashboard preview for sparse feature recovery, stability, and causal intervention analysis.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1220"/><stop offset="1" stop-color="#1d2436"/></linearGradient></defs><rect width="1200" height="640" rx="24" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="30" font-weight="800" fill="#f8fafc">Sparse Feature Interpretability Lab</text><text x="48" y="87" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93c5fd">SPARSE AUTOENCODERS · FEATURE RECOVERY · CAUSAL ABLATION</text><text x="1148" y="63" text-anchor="end" font-size="12" font-weight="700" fill="#94a3b8">STATIC / SYNTHETIC PREVIEW</text><rect x="48" y="118" width="255" height="92" rx="15" fill="#101d2d" stroke="#32465f"/><text x="68" y="147" font-size="11" font-weight="700" fill="#94a3b8">GROUND TRUTH</text><text x="68" y="184" font-size="24" font-weight="800" fill="#f8fafc">KNOWN FEATURES</text><rect x="323" y="118" width="255" height="92" rx="15" fill="#101d2d" stroke="#32465f"/><text x="343" y="147" font-size="11" font-weight="700" fill="#94a3b8">MODEL</text><text x="343" y="184" font-size="24" font-weight="800" fill="#93c5fd">SPARSE AE</text><rect x="598" y="118" width="255" height="92" rx="15" fill="#101d2d" stroke="#32465f"/><text x="618" y="147" font-size="11" font-weight="700" fill="#94a3b8">MATCHING</text><text x="618" y="184" font-size="24" font-weight="800" fill="#c4b5fd">COSINE</text><rect x="873" y="118" width="279" height="92" rx="15" fill="#101d2d" stroke="#32465f"/><text x="893" y="147" font-size="11" font-weight="700" fill="#94a3b8">VALIDATION</text><text x="893" y="184" font-size="24" font-weight="800" fill="#4ade80">INTERVENTION</text><rect x="48" y="236" width="535" height="306" rx="18" fill="#0d1725" stroke="#32465f"/><text x="72" y="272" font-size="18" font-weight="800" fill="#f8fafc">Recovery evidence</text><text x="72" y="298" font-size="12" fill="#94a3b8">Correlation and causality stay separate</text><circle cx="78" cy="343" r="6" fill="#60a5fa"/><text x="96" y="348" font-size="14" font-weight="650" fill="#dbeafe">Best learned-direction ↔ true-feature cosine</text><circle cx="78" cy="391" r="6" fill="#a78bfa"/><text x="96" y="396" font-size="14" font-weight="650" fill="#dbeafe">Recovery threshold and dead-latent fraction</text><circle cx="78" cy="439" r="6" fill="#4ade80"/><text x="96" y="444" font-size="14" font-weight="650" fill="#dbeafe">Seed-to-seed stability across replications</text><circle cx="78" cy="487" r="6" fill="#f59e0b"/><text x="96" y="492" font-size="14" font-weight="650" fill="#dbeafe">Targeted ablation + intervention specificity</text><rect x="607" y="236" width="545" height="306" rx="18" fill="#0d1725" stroke="#32465f"/><text x="631" y="272" font-size="18" font-weight="800" fill="#f8fafc">Experiment flow</text><text x="631" y="298" font-size="12" fill="#94a3b8">Known sparse features make claims falsifiable</text><rect x="631" y="333" width="472" height="46" rx="11" fill="#15243a" stroke="#1d4ed8"/><text x="651" y="362" font-size="13" font-weight="800" fill="#93c5fd">GENERATE → MIX INTO SUPERPOSITION</text><rect x="631" y="395" width="472" height="46" rx="11" fill="#211c38" stroke="#6d28d9"/><text x="651" y="424" font-size="13" font-weight="800" fill="#c4b5fd">TRAIN → MATCH LEARNED DIRECTIONS</text><rect x="631" y="457" width="472" height="46" rx="11" fill="#10291f" stroke="#166534"/><text x="651" y="486" font-size="13" font-weight="800" fill="#4ade80">ABLATE → TEST CAUSAL SPECIFICITY</text><text x="48" y="592" font-size="12" fill="#94a3b8">Preview represents a toy known-ground-truth experiment; thresholds and findings are not claimed to transfer to frontier-model activations.</text></g></svg>