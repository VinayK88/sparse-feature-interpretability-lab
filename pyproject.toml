[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-feature-interpretability-lab"
version = "0.1.0"
description = "A reproducible sparse-autoencoder experiment for feature recovery and causal interventions."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Vinay K"}]
dependencies = ["numpy>=2.0"]

[project.scripts]
sparse-feature-lab = "sparse_feature_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
